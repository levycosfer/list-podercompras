<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Preços de Supermercado</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Comparador de Preços de Supermercado</h1>
        
        <form id="form">
            <label for="produto">Produto:</label>
            <input type="text" id="produto" name="produto" required>
            
            <label for="preco">Preço:</label>
            <input type="number" id="preco" name="preco" required step="0.01">
            
            <label for="supermercado">Supermercado:</label>
            <input type="text" id="supermercado" name="supermercado" required>
            
            <label for="data">Data:</label>
            <input type="date" id="data" name="data" required>

            <label for="imagem">Link da Imagem:</label>
            <input type="url" id="imagem" name="imagem" required>
            
            <button type="submit">Registrar Preço</button>
        </form>

        <h2>Histórico de Preços</h2>
        <table id="tabelaPrecos">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Preço</th>
                    <th>Supermercado</th>
                    <th>Data</th>
                    <th>Variação</th>
                    <th>Imagem</th> <!-- Nova coluna para a imagem -->
                </tr>
            </thead>
            <tbody>
                <!-- Dados dinâmicos vão aqui -->
            </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
