<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Preços de Supermercado</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Comparador de Preços de Supermercado</h1>
    </header>

    <section id="form-section">
        <h2>Registrar Preço do Produto</h2>
        <form id="product-form">
            <input type="text" id="product-name" placeholder="Nome do Produto" required>
            <input type="number" id="product-price" placeholder="Preço" required>
            <button type="submit">Registrar Preço</button>
        </form>
    </section>

    <section id="price-history">
        <h2>Histórico de Preços</h2>
        <table id="price-table">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Preço</th>
                    <th>Supermercado</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <script src="script.js"></script>
</body>
</html>
